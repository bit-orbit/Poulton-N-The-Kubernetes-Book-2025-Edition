name: Compile Book PDF with Typst

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Compile Persian PDF
        run: |
          typst compile --font-path fonts book.typ The-Kubernetes-Book-2025-Persian.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-Kubernetes-Book-2025-Persian
          path: The-Kubernetes-Book-2025-Persian.pdf

      - name: Create Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: The-Kubernetes-Book-2025-Persian.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
